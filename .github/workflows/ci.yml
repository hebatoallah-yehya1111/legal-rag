name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly check of the saved RAGAS scores (sends an alert if faithfulness < 0.80).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[pipeline,dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest -v

      - name: Quality gate (RAGAS faithfulness)
        # Fails below 0.75. Exit code 2 means "passed, but below the 0.80 alert level".
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python -m src.quality_gate --fail-below 0.75 --alert-below 0.80 || code=$?
          if [ "${code:-0}" = "1" ]; then exit 1; fi

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-v1

      - name: Install pipeline dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[pipeline,dev]"

      - name: Rebuild corpus, chunks and index from the source PDF
        # The vector store is not in git, so the image needs it rebuilt here.
        # Takes a while on CPU the first time; the model download is cached.
        run: dvc repro

      - name: Build Docker image
        run: docker build -t legal-rag:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag legal-rag:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag legal-rag:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
