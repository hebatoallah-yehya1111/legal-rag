name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest -v

      - name: Build Docker image
        run: docker build -t legal-rag:${{ github.sha }} .

      # TODO: push image to registry once one is configured
      # TODO: add a step that fails CI if RAGAS faithfulness < 0.75
      #       on a fixed 20-question evaluation set
