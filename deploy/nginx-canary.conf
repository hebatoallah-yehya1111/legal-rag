# Canary rollout: 5% of traffic goes to the new version, 95% to the stable one.
# Start both versions, for example:
#   docker run -d --name rag-stable -p 8001:8000 --env-file .env ghcr.io/OWNER/legal-rag:STABLE_TAG
#   docker run -d --name rag-canary -p 8002:8000 --env-file .env ghcr.io/OWNER/legal-rag:NEW_TAG
# Then run nginx with this file as /etc/nginx/conf.d/default.conf.

upstream legal_rag {
    server host.docker.internal:8001 weight=95;   # stable
    server host.docker.internal:8002 weight=5;    # canary
}

server {
    listen 80;

    location / {
        proxy_pass http://legal_rag;
        proxy_set_header Host $host;
        # Needed for the /ask/stream endpoint (Server-Sent Events).
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
