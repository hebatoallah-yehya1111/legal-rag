[build-system]
requires = ["setuptools>=68.0,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag"
version = "0.1.0"
description = "Arabic Legal Document Q&A - RAG system over the Egyptian Civil Code"
requires-python = ">=3.10,<3.13"

# Runtime only: what the API needs to answer questions.
# This is what the Docker image installs.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sentence-transformers>=2.5,<4.0",
    "chromadb>=0.4,<2.0",
    "groq>=0.9,<1.0",
]

[project.optional-dependencies]
# Rebuilding the corpus / index and tracking experiments (dvc repro, MLflow).
pipeline = [
    "pdfplumber>=0.11,<1.0",
    "dvc[gdrive]>=3.48,<4.0",
    "mlflow>=2.11,<4.0",
]

# RAGAS evaluation with the Gemini judge.
evaluation = [
    "ragas==0.2.15",
    "datasets>=2.14,<4.0",
    "langchain-community==0.3.31",
    "langchain-core>=0.3.78,<0.4.0",
    "langchain-openai>=0.3,<0.4",
    "openai>=1.50,<3.0",
    "langchain-huggingface>=0.1,<0.2",
    # Pin this to the version you have installed (pip show langchain-google-genai).
    "langchain-google-genai",
]

dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.3,<1.0",
]

# The code imports "from src.xxx", so the package to install is "src" itself.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]