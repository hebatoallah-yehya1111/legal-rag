[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag"
version = "0.1.0"
description = "Arabic Legal Document Q&A - RAG system over the Egyptian Civil Code"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "sentence-transformers>=2.5",
    "chromadb>=0.4",
    "mlflow>=2.11",
    "dvc>=3.48",
    "ragas>=0.1",
    "langfuse>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
