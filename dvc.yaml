stages:
  build_corpus:
    cmd: python -m src.ingestion --pdf data/raw/egyptian_civil_code.pdf --out data/processed/articles.json
    deps:
      - data/raw/egyptian_civil_code.pdf
      - src/ingestion.py
      - src/schema.py
    outs:
      - data/processed/articles.json

  validate_corpus:
    cmd: python -m pytest tests/test_corpus.py -q && python -c "from pathlib import Path; Path('data/processed/corpus_validated.flag').write_text('ok')"
    deps:
      - data/processed/articles.json
      - tests/test_corpus.py
    outs:
      - data/processed/corpus_validated.flag

  build_chunks:
    cmd: python -m src.chunking --input data/processed/articles.json --out data/processed/chunks.json
    deps:
      - data/processed/articles.json
      - data/processed/corpus_validated.flag
      - src/chunking.py
      - src/config.py
    outs:
      - data/processed/chunks.json

  build_index:
    cmd: python -m src.indexing --input data/processed/chunks.json --out data/processed/vector_store
    deps:
      - data/processed/chunks.json
      - src/indexing.py
      - src/config.py
    outs:
      - data/processed/vector_store