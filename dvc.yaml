stages:
  build_corpus:
    cmd: python -m src.ingestion --pdf data/raw/egyptian_civil_code.pdf --out data/processed/articles.json
    deps:
      - data/raw/egyptian_civil_code.pdf
      - src/ingestion.py
      - src/schema.py
    outs:
      - data/processed/articles.json

  build_chunks:
    cmd: python -m src.chunking --input data/processed/articles.json --out data/processed/chunks.json
    deps:
      - data/processed/articles.json
      - src/chunking.py
    outs:
      - data/processed/chunks.json